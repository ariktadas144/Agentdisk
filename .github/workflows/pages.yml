name: Pages
on:
  push:
    branches: [main]
    paths: [docs/**, scripts/check-site.mjs, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SITE_TOOL_DIR: /tmp/agentdisk-site-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install isolated browser tools
        run: npm install --prefix "$SITE_TOOL_DIR" --no-audit --no-fund playwright@1.64.1
      - name: Install Chromium
        run: '"$SITE_TOOL_DIR/node_modules/.bin/playwright" install --with-deps chromium'
      - name: Verify the published website
        run: node scripts/check-site.mjs
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
